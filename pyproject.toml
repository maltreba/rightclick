[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rightclick-ai-markdown"
version = "0.1.0"
description = "Windows right-click converter that turns files into AI-friendly Markdown."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "rightclickwork" }]
dependencies = []

[project.optional-dependencies]
convert = [
  "markitdown>=0.1.0",
  "pillow>=10.0.0",
]
ocr = [
  "easyocr>=1.7.0",
  "pytesseract>=0.3.10",
]

[project.scripts]
rightclick-ai-markdown = "rightclick_ai_markdown.converter:main"

[tool.setuptools.packages.find]
include = ["rightclick_ai_markdown*"]
